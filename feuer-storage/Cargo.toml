[package]
name = "feuer-storage"
description = "Internal range-storage primitives for Feuer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
exclude.workspace = true

[features]
io-bench = []

[dependencies]
bytes = { workspace = true }
feuer-historian = { workspace = true }
feuer-memory = { workspace = true }
feuer-types = { workspace = true }
fs4 = { workspace = true, features = ["sync"] }
mixtrics = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"

[dev-dependencies]
binggan = "0.17"
blake3 = "1"
mixtrics = { workspace = true, features = ["prometheus"] }
prometheus = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
