[package]
name = "feuer"
description = "A restart-recoverable tiered cache for immutable-object byte ranges"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
exclude.workspace = true

[dependencies]
bytes = { workspace = true }
feuer-memory = { workspace = true }
feuer-types = { workspace = true }
mixtrics = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[features]
default = ["tokio/runtime-tokio"]

[target.'cfg(target_os = "linux")'.dependencies]
feuer-storage = { path = "../feuer-storage" }

[dev-dependencies]
mixtrics = { workspace = true, features = ["prometheus"] }
prometheus = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["runtime-tokio", "macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
