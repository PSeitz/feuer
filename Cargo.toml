[workspace]
resolver = "2"
members = [
  "feuer",
  "feuer-historian",
  "feuer-memory",
  "feuer-replay",
  "feuer-storage",
  "feuer-utils",
]

[workspace.package]
version = "0.23.0-dev"
edition = "2024"
rust-version = "1.91.0"
repository = "https://github.com/PSeitz/feuer"
homepage = "https://github.com/PSeitz/feuer"
keywords = ["cache", "object", "storage"]
authors = ["Feuer Project Authors"]
license = "MIT"
readme = "README.md"
exclude = []

[workspace.dependencies]
bytes = "1"
bytesize = "2.7"
clap = { version = "4", features = ["derive"] }
feuer-historian = { version = "0.23.0-dev", path = "feuer-historian" }
feuer-memory = { version = "0.23.0-dev", path = "feuer-memory" }
feuer-utils = { version = "0.23.0-dev", path = "feuer-utils" }
fs4 = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
mixtrics = "0.2"
parking_lot = "0.12"
prometheus = { version = "0.14", default-features = false }
rustc-hash = "2"
siphasher = "1"
tempfile = "3"
thiserror = "2.0.20"
tokio = { version = "1", default-features = false }
tracing = "0.1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
disallowed_methods = "deny"

[profile.release]
debug = "full"
