# The pull request's title should be fulfilled the following pattern:
#
#     <type>[optional scope]: <description>
#
# Valid types and scopes are listed below. For example:
#
#     build(maven): One level down for native profile
#
# More about configurations on https://github.com/Ezard/semantic-prs#configuration

enabled: true

titleOnly: true

types:
  - feat
  - fix
  - docs
  - style
  - refactor
  - perf
  - test
  - build
  - ci
  - chore
  - revert

targetUrl: https://github.com/PSeitz/feuer/blob/main/.github/semantic.yml
